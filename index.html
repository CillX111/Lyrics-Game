<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line by Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#E9EBF4; --surface:#FFFFFF; --sunk:#DCDFEC; --ink:#17182E; --muted:#5E6180;
  --line:#C9CCDD; --accent:#3440CF; --accent-ink:#FFFFFF; --hi:#FFD43B; --hi-ink:#17182E; --mark:#FFD43B;
  --good:#1F8A55; --good-bg:#DDF3E7; --bad:#B8323C; --bad-bg:#F8E1E3;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --lyric:"Instrument Serif",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#10112A; --surface:#1A1C3A; --sunk:#232548; --ink:#ECEDF8; --muted:#A0A3C4;
  --line:#34375E; --accent:#8C95FF; --accent-ink:#10112A; --hi:#FFD43B; --hi-ink:#17182E; --mark:#8A6D12;
  --good:#5FD39A; --good-bg:#16382B; --bad:#FF8A93; --bad-bg:#3F1E2A;
}}
:root[data-theme="dark"]{
  --ground:#10112A; --surface:#1A1C3A; --sunk:#232548; --ink:#ECEDF8; --muted:#A0A3C4;
  --line:#34375E; --accent:#8C95FF; --accent-ink:#10112A; --hi:#FFD43B; --hi-ink:#17182E; --mark:#8A6D12;
  --good:#5FD39A; --good-bg:#16382B; --bad:#FF8A93; --bad-bg:#3F1E2A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;justify-content:space-between}
.brand{font-weight:800;font-size:26px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px}
.brand i{font-family:var(--lyric);font-weight:400;font-size:30px;color:var(--accent)}
.meter{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.meter .segs{display:flex;gap:4px}
.meter .segs span{width:26px;height:6px;border-radius:3px;background:var(--line)}
.meter .segs span.done{background:var(--accent)}
.meter .segs span.now{background:var(--hi)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.stage{padding:26px 28px}
@media (max-width:480px){.stage{padding:20px 18px}}
.eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 6px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:28px;font-weight:800;line-height:1.15}
h2{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.notice{background:var(--sunk);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--muted)}
.notice b{color:var(--ink)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 14px;font-size:14px}

button{font:inherit;font-weight:600;border-radius:999px;padding:9px 18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.08)}
button.small{padding:4px 11px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.two{grid-template-columns:1fr}}

/* lyric sheet */
.sheet{list-style:none;margin:0;padding:0;display:grid;gap:4px;counter-reset:ln}
.sheet li{display:grid;grid-template-columns:28px 1fr;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.sheet li:last-child{border-bottom:0}
.sheet .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sheet .txt{font-family:var(--lyric);font-size:clamp(21px,3.2vw,28px);line-height:1.25}
.sheet .txt mark{background:linear-gradient(var(--mark),var(--mark)) no-repeat 0 92%/100% 30%;color:inherit;padding:0 2px}
@media (prefers-reduced-motion:no-preference){.sheet .txt mark.new{animation:sweep 1.1s ease-out both}}
@keyframes sweep{from{background-size:0% 30%}to{background-size:100% 30%}}
.sheet .hidden .bar{display:block;height:12px;border-radius:6px;background:var(--sunk);margin-top:8px}
.sheet .hidden:nth-child(odd) .bar{width:72%}.sheet .hidden:nth-child(even) .bar{width:56%}

.guessbox{display:flex;gap:10px}
.guessbox input{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.wait{background:var(--sunk);color:var(--muted)}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.feed li{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed .who{font-weight:600}
.feed .said{font-family:var(--lyric);font-size:19px;font-style:italic}
.feed .ln{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* scoreboard */
.board{list-style:none;margin:0;padding:0;display:grid}
.board li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.board li:last-child{border-bottom:0}
.board .rank{font-family:var(--mono);font-size:12px;color:var(--muted)}
.board .pts{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}
.board .name{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0;overflow-wrap:anywhere}
.tag{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.tag.pick{color:var(--hi-ink);background:var(--hi);border-color:var(--hi)}
.rules{font-size:13px;color:var(--muted);display:grid;gap:6px;margin:0;padding-left:18px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:480px){.podium{grid-template-columns:1fr}}
.podium div{background:var(--sunk);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.podium .p{font-family:var(--mono);font-size:22px}
.songcard{font-family:var(--lyric);font-size:34px;line-height:1.1}
.songcard small{display:block;font-family:var(--display);font-size:15px;color:var(--muted);margin-top:4px}
.linesform{display:grid;gap:8px}
.linesform .l{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:center}
.linesform .l span{font-family:var(--mono);font-size:12px;color:var(--muted)}
select{font:inherit;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
label.inline{display:flex;align-items:center;gap:10px}
.timer{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px}
.timer .secs{font-family:var(--mono);font-size:14px;color:var(--muted);min-width:4.5ch}
.timer .secs b{font-size:30px;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.timer .track{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.timer .track i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .2s linear}
.timer.low .track i{background:var(--bad)}
.timer.low .secs b{color:var(--bad)}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
const ROUNDS = 5, LINES = 6, MAX_PTS = 1000, MIN_PTS = 100, FULL_SECS = 2;
const app = document.getElementById("app");
let db = null, me = null, offset = 0, busy = false, flash = "", clearIds = new Set(), confirmRestart = false;
const S = { lobby: null, players: [], guesses: [], ready: false, demo: false, error: "", lastRevealed: 0 };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeId = s => String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").slice(0, 180);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

/* ---------- matching ---------- */
function norm(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/\(.*?\)|\[.*?\]/g, " ").replace(/\b(feat|ft)\..*$/, " ").replace(/&/g, " and ")
    .replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim().replace(/^the /, "");
}
function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const t = d[j];
      d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = t;
    }
  }
  return d[b.length];
}
function matches(guess, title) {
  const a = norm(guess), b = norm(title);
  if (!a || !b) return false;
  if (a === b) return true;
  return b.length > 4 && lev(a, b) <= Math.floor(b.length * 0.2);
}

/* ---------- derived ---------- */
const L = () => S.lobby || {};
const nameOf = id => S.players.find(p => p.id === id)?.name || "Someone";
const joined = () => S.players.some(p => p.id === me);
const isCorrect = g => g.verdict === true || (g.verdict == null && g.auto);
const now = () => Date.now() + offset;
const dur = x => (x.seconds || 60) * 1000;
const timeLeft = l => Math.max(0, dur(l) - (now() - l.startedAt));
// Lines appear evenly spread over the round: line 1 at 0 s, the last one before time runs out.
const visibleLines = l => {
  const n = l.song?.lines?.length || 0;
  return n ? Math.min(n, 1 + Math.floor((now() - l.startedAt) / (dur(l) / n))) : 0;
};
// Correct within FULL_SECS: 1000 points, then falling steadily to 100 when time runs out.
function ptsFor(g) {
  const e = Math.max(0, g.secs * 1000), full = FULL_SECS * 1000;
  if (e <= full) return MAX_PTS;
  return Math.max(MIN_PTS, Math.round(MAX_PTS - (MAX_PTS - MIN_PTS) * (e - full) / Math.max(1, dur(g) - full)));
}
function results(r) {
  const best = {};
  S.guesses.filter(g => g.round === r && isCorrect(g) && typeof g.secs === "number")
    .forEach(g => { if (!best[g.player] || g.secs < best[g.player].secs) best[g.player] = g; });
  return Object.values(best).sort((a, b) => a.secs - b.secs)
    .map(g => ({ player: g.player, secs: Math.max(0, g.secs), pts: ptsFor(g) }));
}
function totals() {
  const t = Object.fromEntries(S.players.map(p => [p.id, 0]));
  for (let r = 1; r <= (L().round || 0); r++) results(r).forEach(x => { t[x.player] = (t[x.player] || 0) + x.pts; });
  return S.players.map(p => ({ ...p, pts: t[p.id] || 0 })).sort((a, b) => b.pts - a.pts || a.joinedAt - b.joinedAt);
}
const solvedBy = (id, r) => S.guesses.some(g => g.round === r && g.player === id && isCorrect(g));

/* ---------- data ---------- */
// Every change is a small message on a private ntfy.sh topic (one per room). Each browser replays
// the topic's messages in order to rebuild the same game state, then keeps listening for new ones.
const ROOM_RE = /^[a-z0-9]{10,24}$/;
const room = () => { const h = location.hash.slice(1); return ROOM_RE.test(h) ? h : null; };
const topicUrl = () => "https://ntfy.sh/linebyline-" + room();
let docs = {}, seen = new Set(), es = null;

function applyOp(m) {
  let o;
  try { o = JSON.parse(m.message); } catch { return; }
  if (!o || !validPath(o.path) || typeof o.data !== "object" || !o.data) return;
  // "__now__" means "when this message was sent": live messages use this browser's clock, replayed ones ntfy's timestamp.
  const ts = Math.abs(Date.now() - m.time * 1000) < 4000 ? Date.now() : m.time * 1000;
  const data = {};
  for (const [k, v] of Object.entries(o.data)) data[k] = v === "__now__" ? ts : v;
  if (o.op === "set") docs[o.path] = data;
  else if (o.op === "update" && docs[o.path]) {
    if (o.ifMatch && Object.entries(o.ifMatch).some(([k, v]) => docs[o.path][k] !== v)) return;
    Object.assign(docs[o.path], data);
  }
}
function sync() {
  S.lobby = docs["lobby/current"] || null;
  const gid = S.lobby?.gameId;
  const inColl = pre => Object.entries(docs).filter(([k]) => k.startsWith(pre) && !k.slice(pre.length).includes("/")).map(([k, v]) => ({ id: k.slice(pre.length), ...v }));
  S.players = gid ? inColl(`games/${gid}/players/`).sort((x, y) => x.joinedAt - y.joinedAt) : [];
  S.guesses = gid ? inColl(`games/${gid}/guesses/`) : [];
  S.ready = true; S.pReady = true;
  render();
}
let syncQueued = false;
function connect() {
  es?.close(); docs = {}; seen = new Set(); S.lobby = null; S.players = []; S.guesses = [];
  if (!room()) { S.ready = true; S.pReady = true; render(); return; }
  S.ready = false; render();
  es = new EventSource(topicUrl() + "/sse?since=all");
  es.addEventListener("open", () => { S.error = ""; setTimeout(sync, 600); });
  es.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.event !== "message" || seen.has(m.id)) return;
    seen.add(m.id); applyOp(m);
    if (!syncQueued) { syncQueued = true; setTimeout(() => { syncQueued = false; sync(); }, 30); }
  };
  es.onerror = () => { if (S.ready) { S.error = "Connection lost — reconnecting…"; render(); } };
}
function boot() {
  const tab = new URLSearchParams(location.search).get("player") || "";
  let id = store.get("lbl-id" + tab);
  if (!id) { id = "p" + rid(); store.set("lbl-id" + tab, id); }
  me = safeId(id);
  if (new URLSearchParams(location.search).has("demo")) return startDemo();
  window.addEventListener("hashchange", connect);
  connect();
}
const validPath = p => typeof p === "string" && p.length < 400 && /^[A-Za-z0-9_\-.~:@+]+(\/[A-Za-z0-9_\-.~:@+]+)*$/.test(p);
async function send(op, path, data, ifMatch) {
  const r = await fetch(topicUrl(), { method: "POST", body: JSON.stringify({ op, path, data, ifMatch }) });
  if (!r.ok) throw new Error(r.status === 429 ? "too many actions at once, wait a few seconds" : "network error " + r.status);
}
const ref = path => ({ set: d => send("set", path, d), update: (d, ifMatch) => send("update", path, d, ifMatch), doc: id => ref(path + "/" + id) });
db = { doc: ref, collection: ref };
const lobbyRef = () => db.doc("lobby/current");

async function run(fn) {
  if (S.demo) { flash = "This is an example round — remove ?demo from the address to play for real."; render(); return; }
  if (busy) return;
  busy = true; flash = ""; render();
  try { await fn(); } catch (e) { flash = "That didn't save: " + (e?.message || e?.code || e) + ". Try again."; }
  busy = false; render();
}
const val = id => (document.getElementById(id)?.value || "").trim();

const actions = {
  async create() {
    const name = val("name");
    if (!name) { flash = "Enter a name first."; return; }
    if (!room()) { history.replaceState(null, "", "#" + (rid() + rid()).replace(/[^a-z0-9]/g, "").slice(0, 16)); connect(); }
    const gameId = rid();
    await lobbyRef().set({ gameId, hostId: me, status: "lobby", round: 0, order: [], chooserId: null, song: null, createdAt: Date.now() });
    await db.collection(`games/${gameId}/players`).doc(me).set({ name: name.slice(0, 24), joinedAt: Date.now() });
    store.set("lbl-name", name); confirmRestart = false;
  },
  async join() {
    const name = val("name");
    if (!name) { flash = "Enter a name first."; return; }
    await db.collection(`games/${L().gameId}/players`).doc(me).set({ name: name.slice(0, 24), joinedAt: Date.now() });
    store.set("lbl-name", name);
  },
  async start() {
    const order = S.players.map(p => p.id);
    await lobbyRef().update({ status: "choosing", round: 1, order, chooserId: order[0], song: null });
  },
  async skip() {
    const order = L().order || [];
    const i = order.indexOf(L().chooserId);
    await lobbyRef().update({ chooserId: order[(i + 1) % order.length] });
  },
  async song() {
    const title = val("s-title"), artist = val("s-artist");
    const lines = Array.from({ length: LINES }, (_, i) => val("s-l" + i)).filter(Boolean);
    const seconds = Number(document.getElementById("s-secs")?.value) || 60;
    if (!title) { flash = "Add the song title — that's what everyone has to guess."; return; }
    if (!lines.length) { flash = "Add at least one lyric line."; return; }
    store.set("lbl-secs", seconds);
    await lobbyRef().update({ song: { title, artist, lines }, seconds, startedAt: "__now__", status: "guessing" }, { status: "choosing" });
    for (const k of ["s-title", "s-artist", ...Array.from({ length: LINES }, (_, i) => "s-l" + i)]) clearIds.add(k);
  },
  async end() { await lobbyRef().update({ status: "reveal" }, { status: "guessing", round: L().round }); },
  async next() {
    const l = L();
    if (l.round >= ROUNDS) return lobbyRef().update({ status: "over" }, { status: "reveal" });
    const order = [...l.order, ...S.players.map(p => p.id).filter(id => !l.order.includes(id))];
    await lobbyRef().update({ status: "choosing", round: l.round + 1, order, chooserId: order[l.round % order.length], song: null }, { status: "reveal", round: l.round });
  },
  async guess() {
    const text = val("guess"), l = L();
    if (!text || l.status !== "guessing" || timeLeft(l) <= 0 || solvedBy(me, l.round)) return;
    clearIds.add("guess");
    await db.collection(`games/${l.gameId}/guesses`).doc(`${l.round}-${me}-${rid()}`).set({
      player: me, round: l.round, text: text.slice(0, 120), at: "__now__", secs: Math.round((now() - l.startedAt) / 100) / 10, seconds: l.seconds,
      auto: matches(text, l.song?.title), verdict: null,
    });
  },
  async restart() {
    if (!confirmRestart) { confirmRestart = true; return; }
    confirmRestart = false;
    const gameId = rid(), keep = S.players.find(p => p.id === me);
    await lobbyRef().set({ gameId, hostId: me, status: "lobby", round: 0, order: [], chooserId: null, song: null, createdAt: Date.now() });
    await db.collection(`games/${gameId}/players`).doc(me).set({ name: keep?.name || store.get("lbl-name") || "Host", joinedAt: Date.now() });
  },
};
async function verdict(id, v) {
  await db.collection(`games/${L().gameId}/guesses`).doc(id).update({ verdict: v });
}

app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;
  if (a === "copy") { navigator.clipboard?.writeText(location.href).then(() => { b.textContent = "Copied!"; }); return; }
  if (a === "ok" || a === "no") return run(() => verdict(b.dataset.id, a === "ok"));
  if (actions[a]) run(actions[a]);
});
app.addEventListener("submit", e => {
  e.preventDefault();
  const a = e.target.dataset.act;
  if (actions[a]) run(actions[a]);
});

/* ---------- clock: countdown, line reveals, round end ---------- */
let shownLines = -1, ending = false;
setInterval(() => {
  const l = L();
  if (l.status !== "guessing" || !l.startedAt) return;
  if (S.demo && timeLeft(l) <= 0) l.startedAt = now();
  const left = timeLeft(l), overdue = now() - l.startedAt - dur(l);
  const el = document.getElementById("timer");
  if (el) {
    el.querySelector("b").textContent = Math.ceil(left / 1000);
    el.querySelector("i").style.width = (100 * left / dur(l)) + "%";
    el.classList.toggle("low", left < 10000);
  }
  if (visibleLines(l) !== shownLines) render();
  if (S.demo) return;
  const guessers = S.players.filter(p => p.id !== l.chooserId);
  const allSolved = guessers.length > 0 && guessers.every(p => solvedBy(p.id, l.round));
  const mine = l.chooserId === me;
  if (((mine && (left <= 0 || allSolved)) || overdue > 4000) && !ending) {
    ending = true;
    lobbyRef().update({ status: "reveal" }, { status: "guessing", round: l.round }).catch(() => {}).finally(() => setTimeout(() => { ending = false; }, 1500));
  }
}, 200);

/* ---------- views ---------- */
function render() {
  const act = document.activeElement, aid = act && act.id;
  const sel = aid && typeof act.selectionStart === "number" ? [act.selectionStart, act.selectionEnd] : null;
  const vals = {};
  app.querySelectorAll("input[id],select[id]").forEach(el => { vals[el.id] = el.value; });
  app.innerHTML = view();
  for (const [k, v] of Object.entries(vals)) {
    const el = document.getElementById(k);
    if (el) el.value = clearIds.has(k) ? "" : v;
  }
  clearIds.clear();
  const nameEl = document.getElementById("name");
  if (nameEl && !nameEl.value) nameEl.value = store.get("lbl-name") || "";
  if (aid) { const el = document.getElementById(aid); if (el) { el.focus(); if (sel) try { el.setSelectionRange(...sel); } catch {} } }
  const l = L();
  const vis = l.status === "guessing" && l.startedAt ? visibleLines(l) : -1;
  S.lastRevealed = vis; shownLines = vis;
}

function view() {
  const l = L();
  const inGame = ["choosing", "guessing", "reveal"].includes(l.status);
  const segs = Array.from({ length: ROUNDS }, (_, i) => {
    const r = i + 1, cls = !inGame && l.status !== "over" ? "" : r < l.round || l.status === "over" || (r === l.round && l.status === "reveal") ? "done" : r === l.round ? "now" : "";
    return `<span class="${cls}"></span>`;
  }).join("");
  const head = `<header>
    <div class="brand">Line <i>by</i> Line</div>
    <div class="meter" aria-label="Round progress">${inGame ? `Round ${l.round} of ${ROUNDS}` : l.status === "over" ? "Final" : `${ROUNDS} rounds`}<div class="segs">${segs}</div></div>
  </header>`;
  const banner = S.demo ? `<div class="notice"><b>Example round.</b> Remove <b>?demo</b> from the address to start a real game.</div>` : "";
  const err = S.error ? `<div class="err">${esc(S.error)}</div>` : flash ? `<div class="err" role="status">${esc(flash)}</div>` : "";
  if (!S.ready) return head + `<div class="panel stage"><p class="muted">Tuning up…</p></div>`;
  return head + banner + err + `<div class="grid"><main class="panel stage">${stage()}</main><aside class="stack">${side()}</aside></div>`;
}

function nameForm(act, cta) {
  return `<form class="stack" data-act="${act}">
    <label for="name">Your name<input id="name" maxlength="24" autocomplete="nickname" placeholder="e.g. Mia"></label>
    <div class="row"><button class="primary" ${busy ? "disabled" : ""}>${cta}</button></div>
  </form>`;
}

function stage() {
  const l = L();
  if (!S.lobby) return `<div class="stack">
    <p class="eyebrow">New game</p>
    <h1>Guess the song from its lyrics — the faster, the more points.</h1>
    <p class="muted">Create a room and you'll get an invite link to send to your friends.</p>
    ${nameForm("create", "Create game")}
  </div>`;

  if (!S.pReady && !S.demo) return `<p class="muted">Tuning up…</p>`;
  if (!joined() && !S.demo) return `<div class="stack">
    <p class="eyebrow">${l.status === "lobby" ? "Room open" : `Game in progress · round ${l.round}`}</p>
    <h1>${esc(nameOf(l.hostId))} invited you to play.</h1>
    <p class="muted">${l.status === "lobby" ? "Join now — the game starts when the host is ready." : "You can jump straight in and start guessing."}</p>
    ${nameForm("join", "Join game")}
  </div>`;

  const host = l.hostId === me, chooser = l.chooserId === me;

  if (l.status === "lobby") return `<div class="stack">
    <p class="eyebrow">Waiting room</p>
    <h1>${S.players.length} ${S.players.length === 1 ? "player" : "players"} in the room</h1>
    <p class="muted">Send this invite link to your friends. Everyone takes a turn picking a song.</p>
    <div class="guessbox"><input id="invite" readonly value="${esc(location.href)}" aria-label="Invite link"><button data-act="copy">Copy link</button></div>
    ${host
      ? `<div class="row"><button class="primary" data-act="start" ${S.players.length < 2 || busy ? "disabled" : ""}>Start game</button>${S.players.length < 2 ? `<span class="muted">Needs at least 2 players.</span>` : ""}</div>`
      : `<p class="notice">Waiting for <b>${esc(nameOf(l.hostId))}</b> to start the game.</p>`}
  </div>`;

  if (l.status === "choosing") {
    if (!chooser) return `<div class="stack">
      <p class="eyebrow">Round ${l.round}</p>
      <h1>${esc(nameOf(l.chooserId))} is picking a song…</h1>
      <p class="muted">Get ready — the clock starts the moment the first lyric appears.</p>
      ${host ? `<div class="row"><button class="small" data-act="skip" ${busy ? "disabled" : ""}>Skip ${esc(nameOf(l.chooserId))}'s turn</button></div>` : ""}
    </div>`;
    const secs = Number(store.get("lbl-secs")) || 60;
    return `<form class="stack" data-act="song">
      <p class="eyebrow">Round ${l.round} · your pick</p>
      <h1>Choose a song</h1>
      <p class="muted">Type the title and the lyrics, one line per box (up to ${LINES}). Line 1 shows straight away, the rest appear one by one while the clock runs.</p>
      <div class="two">
        <label for="s-title">Song title<input id="s-title" maxlength="80" autocomplete="off"></label>
        <label for="s-artist">Artist <span>(optional)</span><input id="s-artist" maxlength="80" autocomplete="off"></label>
      </div>
      <div class="linesform">${Array.from({ length: LINES }, (_, i) => `<div class="l"><span>${i + 1}</span><input id="s-l${i}" maxlength="140" autocomplete="off" aria-label="Lyric line ${i + 1}"${i ? ` placeholder="optional"` : ""}></div>`).join("")}</div>
      <div class="row">
        <label for="s-secs" class="inline">Time to guess
          <select id="s-secs">${[30, 45, 60, 90].map(s => `<option value="${s}" ${s === secs ? "selected" : ""}>${s} seconds</option>`).join("")}</select>
        </label>
      </div>
      <div class="row"><button class="primary" ${busy ? "disabled" : ""}>Start the clock</button></div>
    </form>`;
  }

  if (l.status === "guessing") return guessing(chooser);
  if (l.status === "reveal") return reveal(host, chooser);

  if (l.status === "over") {
    const t = totals();
    return `<div class="stack">
      <p class="eyebrow">Game over</p>
      <h1>${esc(t[0]?.name || "Nobody")} wins with ${t[0]?.pts || 0} points.</h1>
      <div class="podium">${t.slice(0, 3).map((p, i) => `<div><span class="eyebrow">${["1st", "2nd", "3rd"][i]}</span><b>${esc(p.name)}</b><span class="p">${p.pts}</span></div>`).join("")}</div>
      <div class="row"><button class="primary" data-act="restart" ${busy ? "disabled" : ""}>${confirmRestart ? "Click again to start a new game" : "Play again"}</button></div>
    </div>`;
  }
  return "";
}

function sheet(lines, revealed, showAll) {
  const fresh = revealed > S.lastRevealed;
  return `<ol class="sheet">${lines.map((line, i) => {
    const shown = i < revealed || showAll;
    return shown
      ? `<li><span class="n">${i + 1}</span><span class="txt">${i === revealed - 1 && !showAll ? `<mark class="${fresh ? "new" : ""}">${esc(line)}</mark>` : esc(line)}</span></li>`
      : `<li class="hidden"><span class="n">${i + 1}</span><span class="bar" aria-label="Hidden line"></span></li>`;
  }).join("")}</ol>`;
}

function timer(l) {
  const left = timeLeft(l);
  return `<div class="timer${left < 10000 ? " low" : ""}" id="timer" role="timer" aria-label="Seconds left">
    <span class="secs"><b>${Math.ceil(left / 1000)}</b> s</span><span class="track"><i style="width:${100 * left / dur(l)}%"></i></span>
  </div>`;
}

const secsLabel = s => s.toFixed(1).replace(/\.0$/, "") + " s";

function guessing(chooser) {
  const l = L(), r = l.round, song = l.song || { lines: [] }, vis = visibleLines(l);
  const lead = `<p class="eyebrow">Round ${r} · ${esc(nameOf(l.chooserId))}'s song</p>`;
  const res = results(r);
  if (chooser) {
    const gs = S.guesses.filter(g => g.round === r).sort((a, b) => b.at - a.at);
    return `<div class="stack">
      ${lead}
      ${timer(l)}
      <div class="songcard">${esc(song.title)}<small>${esc(song.artist || "Only you can see this")}</small></div>
      ${sheet(song.lines, vis, false)}
      <div class="row"><button data-act="end" ${busy ? "disabled" : ""}>End round now</button></div>
      <div class="stack">
        <h2>Guesses</h2>
        <p class="muted" style="font-size:13px">Close spellings count automatically. Tap ✓ or ✗ to overrule.</p>
        ${gs.length ? `<ul class="feed">${gs.map(g => `<li>
          <div><span class="who">${esc(nameOf(g.player))}</span> <span class="ln">${secsLabel(g.secs || 0)}</span><br><span class="said">“${esc(g.text)}”</span></div>
          <div class="row">${isCorrect(g) ? `<span class="pill good">Correct</span>` : `<span class="pill bad">Wrong</span>`}
            <button class="small" data-act="ok" data-id="${esc(g.id)}" aria-label="Mark correct">✓</button>
            <button class="small" data-act="no" data-id="${esc(g.id)}" aria-label="Mark wrong">✗</button></div>
        </li>`).join("")}</ul>` : `<p class="notice">No guesses yet.</p>`}
      </div>
    </div>`;
  }
  const mineRes = res.find(x => x.player === me);
  const history = S.guesses.filter(g => g.round === r && g.player === me && !isCorrect(g)).sort((a, b) => b.at - a.at);
  const box = mineRes
    ? `<p class="notice"><b>You got it in ${secsLabel(mineRes.secs)} — +${mineRes.pts} points!</b> Sit back while the others keep guessing.</p>`
    : `<form class="guessbox" data-act="guess">
        <input id="guess" maxlength="120" autocomplete="off" placeholder="Song title" aria-label="Your guess for the song title">
        <button class="primary">Guess</button>
      </form>
      <p class="muted" style="font-size:13px">Guess as often as you like. Within ${FULL_SECS} s = ${MAX_PTS} points, then it drops the longer you take.</p>`;
  return `<div class="stack">
    ${lead}
    ${timer(l)}
    ${sheet(song.lines, vis, false)}
    ${box}
    ${history.length ? `<ul class="feed">${history.map(g => `<li><span class="said">“${esc(g.text)}”</span><span class="pill bad">Wrong</span></li>`).join("")}</ul>` : ""}
  </div>`;
}

function reveal(host, chooser) {
  const l = L(), res = results(l.round), song = l.song || { lines: [] };
  const last = l.round >= ROUNDS;
  return `<div class="stack">
    <p class="eyebrow">Round ${l.round} · the song was</p>
    <div class="songcard">${esc(song.title)}${song.artist ? `<small>${esc(song.artist)}</small>` : ""}</div>
    ${sheet(song.lines, song.lines.length, true)}
    <h2>Round results</h2>
    ${res.length ? `<ul class="feed">${res.map(x => `<li><div><span class="who">${esc(nameOf(x.player))}</span> <span class="ln">${secsLabel(x.secs)}</span></div><span class="pill good">+${x.pts}</span></li>`).join("")}</ul>` : `<p class="notice">Nobody got it — ${esc(nameOf(l.chooserId))} stumped the room.</p>`}
    ${host || chooser
      ? `<div class="row"><button class="primary" data-act="next" ${busy ? "disabled" : ""}>${last ? "Show final scores" : `Start round ${l.round + 1}`}</button></div>`
      : `<p class="muted">Waiting for ${esc(nameOf(l.chooserId))} to continue.</p>`}
  </div>`;
}

function side() {
  const l = L();
  const rules = `<section class="panel stack"><h2>How it works</h2><ul class="rules">
    <li>${ROUNDS} rounds. Each round one player picks a song and types its lyrics.</li>
    <li>The lyrics appear line by line while the clock runs. Guess the title as often as you like.</li>
    <li>Get it within ${FULL_SECS} seconds for ${MAX_PTS} points — the longer you take, the fewer you get (at least ${MIN_PTS}).</li>
  </ul></section>`;
  if (!S.lobby || !S.players.length) return rules;
  const t = totals(), r = l.round;
  const board = `<section class="panel stack"><h2>Scores</h2><ol class="board">${t.map((p, i) => {
    let status = "";
    if ((l.status === "guessing" || l.status === "choosing") && p.id === l.chooserId) status = `<span class="tag pick">Picking</span>`;
    else if (l.status === "guessing" && solvedBy(p.id, r)) status = `<span class="pill good">Got it</span>`;
    return `<li><span class="rank">${i + 1}</span><span class="name">${esc(p.name)}${p.id === me ? ` <span class="tag">you</span>` : ""}${p.id === l.hostId ? ` <span class="tag">host</span>` : ""} ${status}</span><span class="pts">${p.pts}</span></li>`;
  }).join("")}</ol></section>`;
  const restart = l.hostId === me && l.status !== "over" && l.status !== "lobby" && !S.demo
    ? `<div class="row"><button class="small" data-act="restart" ${busy ? "disabled" : ""}>${confirmRestart ? "Click again to wipe scores" : "Restart game"}</button></div>` : "";
  return board + rules + restart;
}

/* ---------- example round (page opened without the server) ---------- */
function startDemo() {
  S.demo = true; S.ready = true; me = "you";
  const t = Date.now(), r1 = t - 400000;
  S.players = [
    { id: "mia", name: "Mia", joinedAt: 1 }, { id: "jonas", name: "Jonas", joinedAt: 2 },
    { id: "lea", name: "Lea", joinedAt: 3 }, { id: "you", name: "You", joinedAt: 4 },
  ];
  S.lobby = {
    gameId: "demo", hostId: "mia", status: "guessing", round: 2, order: ["mia", "jonas", "lea", "you"], chooserId: "jonas",
    startedAt: t - 21000, seconds: 60,
    song: { title: "Paper Lanterns", artist: "The Night Ferries", lines: [
      "Hang the paper lanterns where the harbour meets the rain",
      "Every boat that leaves tonight is calling out your name",
      "I kept the ticket stub you left inside my winter coat",
      "And I read it like a letter, like a promise that you wrote",
      "Light them up, light them up",
      "Let the whole town see us burning",
    ] },
  };
  const g = (player, round, secs, text, auto, start) => ({ id: `${round}-${player}-${secs}`, player, round, text, auto, verdict: null, secs, seconds: 60, at: start + secs * 1000 });
  S.guesses = [
    g("jonas", 1, 1.8, "Harbour Lights", true, r1), g("you", 1, 9.4, "Harbor Lights", true, r1), g("lea", 1, 31, "harbour lights", true, r1),
    g("lea", 2, 4, "Rain on the Harbour", false, t - 21000), g("you", 2, 6, "Winter Coat", false, t - 21000),
    g("mia", 2, 12.5, "Paper Lanterns", true, t - 21000), g("you", 2, 15, "Night Boats", false, t - 21000),
  ];
  render();
}

boot();
</script>
</body>
</html>
